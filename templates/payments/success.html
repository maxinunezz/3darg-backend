<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¡Gracias por tu compra!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center shadow p-5 bg-white rounded">
                <div class="mb-4">
                    <h1 class="text-success">¡Pago Exitoso! ✅</h1>
                    <p class="lead">Gracias por confiar en <strong>3DArg</strong>.</p>
                </div>
                
                <div class="card mb-4 text-start">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Resumen de Orden</h5>
                        <p class="mb-1"><strong>ID de Orden:</strong> {{ order.id }}</p>
                        <p class="mb-1"><strong>Total:</strong> {{ order.currency }} {{ order.total_amount }}</p>
                        <p class="mb-1"><strong>Estado:</strong> <span class="badge bg-success">Pagado</span></p>
                    </div>
                </div>

                <p class="text-muted small">Te enviamos un detalle de la compra a: <strong>{{ order.customer_email }}</strong></p>
                
                <a href="/" class="btn btn-primary w-100 mt-3">Volver a la tienda</a>
            </div>
        </div>
    </div>
</body>
</html>
